<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COOL AI</title>
  
  <!-- 字體 Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX 數學方程式排版 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Highlight.js 程式碼語法高亮 (github-dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Marked Markdown 解析器 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.5">
</head>
<body>
  <div class="app" id="app">
    <!-- 手機版側欄遮罩 (Backdrop) -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- 側邊欄 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-text">COOL AI</span>
        </div>
        <div class="sidebar-header-actions">
          <button id="toggleSidebarBtn" class="sidebar-icon-btn" title="收起資訊列" aria-label="切換側邊欄">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- 側邊欄快速選單 -->
      <div class="sidebar-quick-nav">
        <button id="newChatBtn" class="nav-item active-nav" title="新對話">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span class="nav-text">新對話</span>
        </button>
        <button id="tempChatBtn" class="nav-item" title="臨時對話">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="4 4"></circle>
            <polyline class="temp-check-mark" points="8 12 11 15 16 9"></polyline>
          </svg>
          <span class="nav-text">臨時對話</span>
        </button>
      </div>

      <!-- 最近歷史對話 -->
      <div class="sidebar-history-section">
        <div class="sidebar-section-title">最近</div>
        <div id="chatList" class="chat-list"></div>
      </div>

      <!-- 側邊欄底部個人資訊與設定 -->
      <div class="sidebar-footer">
        <div class="user-profile-btn" id="userProfileBtn" title="設定">
          <div class="user-avatar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </div>
          <div class="user-info">
            <span class="user-name">設定</span>
            <span class="user-plan">金鑰與系統設定</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主對話區 -->
    <main class="main" id="mainPane">
      <!-- 頂部導航列 -->
      <header class="top-nav">
        <div class="top-nav-left">
          <!-- 手機版側邊欄抽屜開關按鈕 (ChatGPT 漢堡選單圖標) -->
          <button id="mobileSidebarToggleBtn" class="top-icon-btn mobile-only-btn" title="開啟選單" aria-label="開啟選單" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <!-- 頂部 Video ID 客製化深色下拉選單 -->
          <div class="video-dropdown-wrapper" id="videoDropdownWrapper">
            <button id="videoIdDropdownBtn" class="video-dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="video-btn-prefix">Video ID</span>
              <span id="currentVideoIdLabel" class="video-btn-label">載入中…</span>
              <svg class="chevron-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div id="videoIdMenu" class="video-dropdown-menu" hidden>
              <div class="dropdown-header-title">選擇課程 Video ID</div>
              <div id="videoIdOptionsList" class="video-options-list"></div>
              <div class="dropdown-footer-action" id="manageVideoIdsBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>管理 Video ID 清單…</span>
              </div>
            </div>
          </div>
        </div>

        <div class="top-nav-right">
          <!-- 手機版快速開啟新對話按鈕 (ChatGPT 筆型圖標) -->
          <button id="mobileNewChatBtn" class="top-icon-btn mobile-only-btn" title="新對話" aria-label="新對話" type="button">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- 內容區容器 -->
      <div class="chat-viewport" id="chatViewport">
        <!-- 下拉重新整理指示器 (Pull-to-Refresh) -->
        <div id="ptrIndicator" class="ptr-indicator" aria-hidden="true">
          <div class="ptr-bubble" id="ptrBubble">
            <svg class="ptr-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
          </div>
        </div>

        <!-- 初始歡迎畫面 Hero -->
        <div id="emptyState" class="hero-container">
          <h1 id="heroTitle" class="hero-title">今天想問什麼？</h1>
        </div>

        <!-- 歷史對話區 -->
        <div id="messages" class="messages-container" hidden></div>
      </div>

      <!-- 底部浮動輸入列 -->
      <div class="composer-container">
        <!-- 附圖預覽卡片 -->
        <div id="attachPreview" class="attach-chip" hidden>
          <div class="attach-thumb-wrap">
            <img id="attachThumb" src="" alt="預覽">
          </div>
          <span id="attachName" class="attach-name">附圖</span>
          <button id="attachRemove" class="attach-close-btn" title="移除附件">&times;</button>
        </div>

        <div class="composer-capsule">
          <!-- 上傳按鈕 (+) -->
          <input type="file" id="imageInput" accept="image/png,image/jpeg" hidden>
          <button id="attachBtn" class="capsule-btn attach-action-btn" title="附加檔案或截圖" aria-label="附加檔案">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <!-- 文字輸入框 (自適應高度，支援手機虛擬鍵盤送出鍵) -->
          <textarea id="questionInput" class="composer-textarea" placeholder="想問什麼都可以" rows="1" enterkeyhint="send"></textarea>

          <!-- 右側操作群組 -->
          <div class="capsule-right-group">
            <!-- 思考模式開關 (無腦子 icon) -->
            <button id="thinkingToggleBtn" class="thinking-pill" title="開關思考推導模式" type="button">
              <span class="thinking-text">思考</span>
              <input type="checkbox" id="thinkingToggle" hidden>
            </button>

            <!-- 送出按鈕 (圓形向上箭頭) -->
            <button id="sendBtn" class="capsule-send-btn" title="送出訊息" aria-label="送出" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- 輸入欄底部提示與字數計量器 -->
        <div class="composer-subline">
          <span class="privacy-hint">COOL AI 亦可能會犯錯。請查核重要資訊。</span>
          <div id="charMeter" class="char-counter">
            <span id="charText" class="char-text">0 / 20,000</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 設定 Modal -->
  <div id="settingsModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">系統設定</h2>
        <button id="settingsCloseIcon" class="modal-close-icon">&times;</button>
      </div>

      <div class="modal-body">
        <div class="field-group">
          <label class="field-label" for="userKeyInput">使用者金鑰（COOL AI 啟用碼）</label>
          <div class="input-with-action">
            <input type="password" id="userKeyInput" class="dark-input" placeholder="貼上你的啟用金鑰">
            <button id="toggleKeyVisible" class="input-inline-btn" title="顯示/隱藏金鑰" type="button">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="field-desc">金鑰僅存於本地伺服器 data/settings.json，不會外流。</span>
        </div>

        <div class="field-group">
          <label class="field-label" for="videoIdsInput">Video ID 清單（每行一組）</label>
          <textarea id="videoIdsInput" class="dark-textarea" rows="4" placeholder="a533137f-3d03-4951-9a6e-26bed8c8487b&#10;4d38e152-a170-4977-b2cc-84e528a4bbb3"></textarea>
          <span class="field-desc">開新對話時隨機抽選；可在頂部選單即時更換當前對話綁定的 Video ID。</span>
        </div>

        <!-- 偽造字幕設定區塊 -->
        <div class="field-group">
          <div class="field-header-row">
            <label class="field-label" for="mockSubtitlesInput">偽造課程字幕（模擬官方 subtitles 欄位）</label>
            <label class="checkbox-inline-wrap" title="開關是否在請求中送出字幕資料">
              <input type="checkbox" id="enableSubtitlesToggle" class="dark-checkbox" checked>
              <span class="checkbox-label-text">啟用發送字幕</span>
            </label>
          </div>
          <div class="subtitles-toolbar">
            <button id="loadSampleSubtitlesBtn" class="btn-text-action" type="button" title="載入標準官方字幕 JSON 格式">載入範例</button>
            <button id="formatSubtitlesJsonBtn" class="btn-text-action" type="button" title="將多行純文字轉為標準 JSON 格式">轉為 JSON</button>
            <button id="clearSubtitlesBtn" class="btn-text-action" type="button" title="清空輸入框">清空</button>
          </div>
          <textarea id="mockSubtitlesInput" class="dark-textarea dark-code-textarea" rows="4" placeholder='支援純文字每行一句（自動計算時間軸），或貼入標準 JSON 格式：&#10;[&#10;  {&#10;    "text": "本節課重點講解...",&#10;    "start": 0,&#10;    "end": 4,&#10;    "translation": "本節課重點講解..."&#10;  }&#10;]'></textarea>
          <span class="field-desc">送出請求時附帶此字幕資料，使 AI 學習夥伴誤認影片字幕內容。支援每行一句純文字或標準 JSON 陣列。</span>
        </div>

        <div class="settings-row-2col">
          <div class="field-group">
            <label class="field-label" for="charLimitInput">總字數上限（0 = 不限制）</label>
            <input type="number" id="charLimitInput" class="dark-input" min="0" step="500">
          </div>
          <div class="field-group">
            <label class="field-label" for="historyTurnsInput">歷史紀錄截斷輪數（0 = 全部保留）</label>
            <input type="number" id="historyTurnsInput" class="dark-input" min="0" step="1">
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="settingsCancel" class="btn btn-secondary">取消</button>
        <button id="settingsSave" class="btn btn-primary">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 刪除確認 Modal (對標 ChatGPT 官方樣式) -->
  <div id="deleteConfirmModal" class="modal-overlay" hidden>
    <div class="modal-card delete-dialog-card">
      <div class="delete-dialog-header">
        <h2 class="delete-dialog-title">刪除聊天？</h2>
      </div>
      <div class="delete-dialog-body">
        <p class="delete-dialog-desc">這將刪除 <strong id="deleteTargetChatTitle"></strong>。</p>
      </div>
      <div class="delete-dialog-footer">
        <button id="deleteCancelBtn" class="dialog-pill-btn dialog-cancel-btn" type="button">取消</button>
        <button id="deleteConfirmBtn" class="dialog-pill-btn dialog-danger-btn" type="button">刪除</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}?v=1.5"></script>
</body>
</html>
